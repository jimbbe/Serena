services:
  postgres:
    image: postgres:16-alpine
    container_name: serena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serena}
      POSTGRES_USER: ${POSTGRES_USER:-serena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serena}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - serena-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  serena-core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    container_name: serena-core
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://serena:serena@postgres:5432/serena}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${POSTGRES_DB:-serena}
      DATABASE_USER: ${POSTGRES_USER:-serena}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-serena}
      SERENA_INTERNAL_TOKEN: ${SERENA_INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CORE_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  serena-postgres-data:
    name: serena-postgres-data
