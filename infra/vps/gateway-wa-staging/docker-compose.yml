services:
  gateway-wa:
    # Only gateway-wa may bridge Serena Core <-> Evolution API.
    # No host ports published in this template.
    build:
      context: ../../..
      dockerfile: apps/gateway-wa/Dockerfile
    env_file:
      - .env
    networks:
      - proxy
      - serena-internal
      - evolution-private
    volumes:
      - ./routing-table.json:/app/config/routing-table.json:ro
    restart: unless-stopped

  evolution-api:
    # Evolution API stays private on evolution-private (no proxy/public route).
    image: atendai/evolution-api:latest
    env_file:
      - .env
    depends_on:
      - evo-postgres
      - redis
    networks:
      - evolution-private
    restart: unless-stopped

  evo-postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - evo-postgres-data:/var/lib/postgresql/data
    networks:
      - evolution-private
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - evo-redis-data:/data
    networks:
      - evolution-private
    restart: unless-stopped

networks:
  proxy:
    external: true
  serena-internal:
    external: true
  evolution-private:
    # Private bridge for gateway-wa/evolution dependencies only.
    driver: bridge

volumes:
  evo-postgres-data:
  evo-redis-data:
