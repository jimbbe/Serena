# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Node.js >=22.6 + TypeScript 5.9 (strict), ESM, npm workspaces monorepo
  Architecture: Clean/Hexagonal — domain (pure types), application (ports + use cases), infrastructure (adapters)
  Testing: node:test + node:assert/strict (built-in), no external test framework
  Style: TypeScript strict mode (noUncheckedIndexedAccess, exactOptionalPropertyTypes), 
         .editorconfig (2 spaces, LF), no linter or formatter installed

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: true
  detected: 2026-05-10
  runner:
    command: npm test
    framework: node:test (Node.js built-in)
  layers:
    unit:
      available: true
      tool: node:test
    integration:
      available: true
      tool: node:test (HTTP via node:test + native fetch)
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality:
    linter:
      available: false
      command: null
    type_checker:
      available: true
      command: npm run typecheck (tsc --noEmit)
    formatter:
      available: false
      command: null
